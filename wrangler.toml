name = "turk-askeri"
main = "src/worker.js"
compatibility_date = "2025-10-01"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*", "/ws"]

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[durable_objects.bindings]]
name = "ACCOUNTS"
class_name = "Accounts"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room", "Accounts"]

# Yayına alırken (zone Cloudflare'de ise) alt alan adını otomatik bağlar:
# [[routes]]
# pattern = "ta.shanidargame.com"
# custom_domain = true
